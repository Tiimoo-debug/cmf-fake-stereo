# CMF Phone 1 stereo - routing actions
#
# EMPTY BY DESIGN. Nothing here is guessed: the control names on this device
# have to come from a real probe, because a wrong mixer write is at best
# silence and at worst a damaged earpiece.
#
#   1. su
#   2. stereoctl probe
#   3. send the report from /sdcard/cmf-stereo-probe-*/ back for analysis
#   4. the resulting lines get pasted in here
#
# Syntax, one action per line, applied top to bottom:
#
#   ctl|<mixer control name>|<value>     set an ALSA mixer control
#   sysfs|<path>|<value>                 write to a sysfs node
#   prop|<property>|<value>              set a system property
#
# The original value of everything touched is saved under
# /data/adb/cmf-stereo/state/ and restored when playback stops or the
# module is disarmed.
#
# Examples of the SHAPE these take (names are illustrative, not real for
# this device - do not uncomment them blind):
#
#   ctl|Receiver Switch|1
#   ctl|RCV_DAC Playback Volume|8
#   ctl|Audio_Amp_R_Sel|RCV
#
# ---- SAFETY -----------------------------------------------------------
# The earpiece is a small transducer with a fraction of the excursion and
# power handling of the main speaker. When you first find a working route,
# set its gain LOW and raise it a step at a time. Distortion or a rattle
# means back off immediately - it does not recover.
# -----------------------------------------------------------------------
