# CMF Phone 1 stereo - behaviour settings
# Edit with any text editor, then: stereoctl restart
# (MODE and ENABLED are re-read every cycle, no restart needed for those.)

# Master switch. 0 = do nothing at all.
ENABLED=1

# playback = only drive the earpiece while audio is actually playing
#            (recommended: the earpiece is not built to run continuously)
# always   = keep the routing applied at all times
MODE=playback

# How often to re-assert the routing, in seconds. The HAL resets mixer
# controls on every route change, so this cannot be very large. 2 is a good
# balance; raise it to 5 if you notice battery drain.
WATCH_INTERVAL=2

# Seconds to wait after boot before touching anything.
STARTUP_DELAY=10

# Skip the earpiece when headphones or Bluetooth audio are connected.
# Costs one dumpsys call per cycle, so it is off by default; the routing
# usually falls away on its own when the output device changes.
REQUIRE_SPEAKER_ROUTE=0

# Only apply the routing while GUARD_CTL reads GUARD_VALUE. Leave GUARD_CTL
# empty to disable the check. On the CMF Phone 1 this is set to the speaker
# amp switch, which the HAL turns off when headphones or Bluetooth take over -
# so the earpiece follows the speaker rather than playing to nobody.
GUARD_CTL=
GUARD_VALUE=

# How to tell that audio is playing. Leave PLAYBACK_CTL empty to scan
# /proc/asound for a RUNNING substream. That scan misses DSP-offload playback
# entirely, so on devices where media bypasses the normal PCM path, name a
# mixer control the HAL flips when media starts - find one with
# 'stereoctl diff' and read off what changes.
PLAYBACK_CTL=
PLAYBACK_VALUE=1

# ALSA card to talk to. Empty = tinymix default (card 0), which is right on
# essentially every phone. Set only if the probe shows several sound cards.
MIXER_CARD=

# debug | info | warn
LOG_LEVEL=info
LOG_MAX_KB=512
