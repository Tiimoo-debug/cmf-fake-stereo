# CMF Phone 1 (A015 / Tetris, mt6878) - earpiece as second speaker
#
# Verified working on Nothing OS B4.1-260615-1652, Android 16.
#
# Why these three, in this order:
#
# On this device the media path never touches the internal codec. Playback
# goes DL_24CH -> I2SOUT4 -> Awinic aw_dev_0 smart PA -> bottom speaker. The
# earpiece hangs off the internal codec's DAC (ADDA_DL), which normally has
# no source connected at all - which is why simply pointing RCV Mux at the
# receiver produces silence.
#
#   1. Handset Volume            earpiece gain, set BEFORE it is driven
#   2. ADDA_DL_CH1 DL_24CH_CH1   feed the internal DAC from the same stream
#                                that is already going to the speaker
#   3. RCV Mux = Voice Playback  route that DAC to the earpiece
#
# Order matters: connect the feed before opening the mux, so the receiver is
# never pointed at an undefined path.

ctl|Handset Volume|31
ctl|ADDA_DL_CH1 DL_24CH_CH1|1
ctl|RCV Mux|Voice Playback

# ---- gain -------------------------------------------------------------
# Handset Volume is the receiver's own gain. Its field is 5 bits, so 31 is
# the top (40 wraps to 8, measured).
#
# It has little audible effect here. Loudness is set by ADDA_DL_GAIN, the
# digital gain on the internal codec downlink: measured inaudible at 2000 and
# normal at 65535, and the HAL already parks it at ~63311 of 65535 during
# playback - about 0.3 dB from maximum. The earpiece is therefore already as
# loud as this path allows, and 5 vs 31 here sounds much the same.
#
# An earlier revision of this file claimed 31 was the loudness ceiling and
# that values above 18 were "non-monotonic". Both were wrong: the large
# improvement credited to this control was ADDA_DL_GAIN recovering after it
# had been mistakenly lowered, and the apparent disorder was small variation
# across a nearly flat response.
#
# ADDA_DL_GAIN is deliberately NOT set here. ADDA_DL is shared with the
# headphone path, so pinning it would raise headphone output as a side effect
# in exchange for a fraction of a dB.
#
# Lowering Handset Volume does work, so keep it if you want the earpiece
# quieter than the speaker. The receiver still has no protection circuit:
# back off at the first buzz.

# ---- channels: why there is no left/right split -----------------------
# Both transducers are hard-wired to channel 1 of the DL mixer. Measured:
#
#   speaker   I2SOUT4_CH1 <- DL_24CH_CH1 only. Cutting CH1 silences it;
#             cutting CH2 changes nothing. I2SOUT4_CH1 has no DL_24CH_CH2
#             source available, so the speaker cannot be moved to the right
#             channel.
#
#   earpiece  RCV <- ADDA_DL_CH1 <- DL_24CH_CH1 only. Feeding ADDA_DL_CH2
#             instead leaves the receiver path unpowered, which shows up as
#             Handset Volume refusing to hold a non-zero value: the register
#             will not latch while DAPM has the path down.
#
# So a true stereo split is not reachable by MIXER ROUTING on this hardware.
# MediaTek's 2nd-loudspeaker parameters do exist in /vendor/etc/audio_param,
# so whether the HAL can be made to drive the receiver as a second speaker
# through that path is a separate, open question.
# What this module gives you is both drivers playing the same content -
# more output and a fuller, taller image than the single bottom speaker,
# but not two independent channels.
#
# Do NOT run 'stereoctl xml-patch' on this device. The policy declaring the
# speaker as mono is what makes the framework sum L+R before DL_24CH, so
# CH1 carries the whole mix. Widening that port to stereo would put only
# the LEFT channel on CH1 - and since both outputs read CH1, you would lose
# the right channel entirely. Mono-summed is the correct behaviour here.
